<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Markdown 转纯文本</title>
  <meta name="description" id="metaDescription" content="将 Markdown 转为可读纯文本的静态网页工具，保留列表、换行、代码块与链接等关键信息。">
  <meta name="keywords" content="Markdown,纯文本,Markdown 转换,文本提取,在线工具">
  <link rel="canonical" href="./index.html">
  <meta property="og:title" content="Markdown 转纯文本">
  <meta property="og:description" id="metaOgDescription" content="将 Markdown 转为可读纯文本的静态网页工具，保留列表、换行、代码块与链接等关键信息。">
  <meta property="og:type" content="website">
  <meta property="og:url" content="./index.html">
  <meta name="twitter:card" content="summary">

  <!-- 引入 Markdown-it 库 -->
  <script src="https://cdn.jsdelivr.net/npm/markdown-it@14.1.0/dist/markdown-it.min.js"></script>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <header>
    <div class="header-row">
      <div>
        <h1 data-i18n="title">Markdown 转纯文本</h1>
        <p data-i18n="subtitle">在下面的文本框中输入你的 Markdown 内容，然后点击「转为纯文本」。</p>
      </div>
      <div class="header-controls">
        <div class="select" id="langSelect">
          <button type="button" class="select-trigger" id="langSelectTrigger" aria-haspopup="listbox" aria-expanded="false">
            <span class="select-label" data-i18n="languageLabel">语言：</span>
            <span class="select-value" id="langSelectValue"></span>
          </button>
          <ul class="select-menu" role="listbox" id="langSelectMenu"></ul>
        </div>
        <div class="select" id="themeSelect">
          <button type="button" class="select-trigger" id="themeSelectTrigger" aria-haspopup="listbox" aria-expanded="false">
            <span class="select-label" data-i18n="themeLabel">主题：</span>
            <span class="select-value" id="themeSelectValue"></span>
          </button>
          <ul class="select-menu" role="listbox" id="themeSelectMenu"></ul>
        </div>
      </div>
    </div>
  </header>
  
  <section class="panel">
    <form id="markdownForm">
      <label for="markdownInput" data-i18n="inputLabel">Markdown 内容：</label>
      <textarea id="markdownInput" rows="8" placeholder="在这里输入 Markdown 格式文本" data-i18n-placeholder="placeholder"></textarea>
      <div class="toolbar">
        <button type="button" id="convertBtn" data-i18n="convertBtn">转为纯文本</button>
        <button type="button" id="loadSampleBtn" class="secondary" data-i18n="loadSampleBtn">加载完整样例</button>
      </div>
    </form>
  </section>

  <section class="panel">
    <h2 data-i18n="resultTitle">转换结果：</h2>
    <pre id="plainOutput"></pre>
    <div class="toolbar">
      <button type="button" id="copyBtn" class="secondary" data-i18n="copyBtn">复制</button>
    </div>
  </section>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  
  <script type="module" src="app.js"></script>
</body>
</html>
